# ──────────────────────────────────────────────────────────────
#  Nginx config for LearnHub LMS (Production)
#
#  - Serves the React SPA (handles client-side routing)
#  - Proxies /api/*      → backend:5000/api/*
#  - Proxies /uploads/*  → backend:5000/uploads/*
#  - Adds gzip compression and cache headers for assets
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Root for the React build output
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Proxy /api → backend service ─────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large uploads (video files can be up to 500 MB)
        client_max_body_size 520m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # ── Proxy /uploads → backend static files ────────────────
    location /uploads/ {
        proxy_pass         http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;

        # Cache uploaded assets (images, PDFs) aggressively
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Cache static build assets ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React SPA — all other routes go to index.html ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
